# ----- MONITOR -----
monitor=eDP-2,1920x1080@144,0x0,1

# ----- NVIDIA ENV VARS -----
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,default
env = HYPRLAND_NO_SD_NOTIFY,1
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
source = ~/.cache/wallust/hyprland.conf
# ----- AUTOSTART -----
exec-once = waybar
exec-once = waypaper --restore
exec-once = blueman-applet
exec-once = hypridle
exec-once = awww-daemon
exec-once = mako
# ----- VARIABLES -----
$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = fuzzel

# ----- INPUT -----
input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}
device {
    name = ite-tech.-inc.-ite-device(8176)-keyboard-1
    enabled = false
}

device {
    name = elan06fa:00-04f3:327e-mouse
    enabled = false
}

# ----- GENERAL -----
general {
    gaps_in = 4
    gaps_out = 7
    border_size = 2
    col.active_border = $wallust_border
    col.inactive_border = rgba(ffffff05)
    allow_tearing = false
    layout = dwindle
}
# ---- MISC ----
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ----- DECORATION -----
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0 
    inactive_opacity = 1.0
    blur {
       enabled = no
        size = 6
        passes = 3
        new_optimizations = on 
        xray = true
        vibrancy = 0.4
        vibrancy_darkness = 0.3
    }
    shadow {
        enabled = false
    }
}

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
# ----- ANIMATIONS -----

animations {
    enabled = yes

    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.05

    animation = windows, 1, 5,  overshot, gnomed
    animation = windowsOut, 1, 5, ease, slide bottom
    animation = windowsMove, 1, 5, overshot, slide

    animation = layers, 1, 5, ease, gnomed
    animation = fade, 1, 2, ease
    animation = border, 1, 2, ease
    animation = workspaces, 1, 5, overshot, slide
} 

# ----- CURSOR -----
cursor {
    no_hardware_cursors = false
    default_monitor = eDP-2
}

# ----- XWAYLAND -----
xwayland {
    enabled = true 
}

# ----- KEYBINDS -----

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, exec, ~/.config/hypr/wal.sh
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

#toggle refresh rate 
bind = $mainMod, F2, exec, ~/.config/hypr/refresh-toggle.sh

# Screenshots
bind = , Print, exec, grimblast copy screen
bind = $mainMod, Print, exec, grimblast copy area

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows
bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r

# Resize windows
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Workspaces - switch
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Workspaces - move window
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Scratchpad
bind = $mainMod, T, togglespecialworkspace, magic
bind = $mainMod SHIFT, T, movetoworkspace, special:magic

bind = SUPER, F, fullscreen


#toggle gaps 
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/togglegaps.sh

#waybar switch
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/waybar-switch.sh


#blur toggle
bind = $mainMod SHIFT, U, exec, ~/.config/hypr/blur-toggle.sh




