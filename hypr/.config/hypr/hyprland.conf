# ===========================
# SHAARAV'S HYPRLAND CONFIG
# ===========================

# ----- MONITOR -----
monitor=eDP-2,1920x1080@144,0x0,1

# ----- NVIDIA ENV VARS -----
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,default
env = HYPRLAND_NO_SD_NOTIFY,1
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
source = /home/osleepy/.cache/wal/hyprland-colors.conf
# ----- AUTOSTART -----
exec-once = waybar
exec-once = waypaper --restore
exec-once = blueman-applet
exec-once = hypridle
exec-once = awww-daemon
exec-once = mako
exec-once = bash $HOME/.config/hypr/wal-watch.sh
# ----- VARIABLES -----
$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = rofi -show drun

# ----- INPUT -----
input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}
device {
    name = ite-tech.-inc.-ite-device(8176)-keyboard-1
    enabled = false
}

device {
    name = elan06fa:00-04f3:327e-mouse
    enabled = false
}

# ----- GENERAL -----
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = $wal_accent
    col.inactive_border = rgba(ffffff05)
}
# ---- MISC ----
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ----- DECORATION -----
decoration {
    rounding = 10
    active_opacity = 1.0 
    inactive_opacity = 1.0
    blur {
        enabled = false 
        size = 3
        passes = 1
    }
    shadow {
        enabled = false
    }
}
# ----- ANIMATIONS -----
animations {
    enabled = false
    bezier = smooth, 0.25, 0.9, 0.1, 1.0
    animation = windows, 1, 2, smooth
    animation = workspaces, 1, 2, smooth
}

# ----- CURSOR -----
cursor {
    no_hardware_cursors = false
    default_monitor = eDP-2
}

# ----- XWAYLAND -----
xwayland {
    enabled = true 
}

# ----- KEYBINDS -----

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, exec, ~/.config/hypr/wal.sh
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

#toggle refresh rate 
bind = $mainMod, F2, exec, ~/.config/hypr/refresh-toggle.sh

# Screenshots
bind = , Print, exec, grimblast copy screen
bind = $mainMod, Print, exec, grimblast copy area

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows
bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r

# Resize windows
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Workspaces - switch
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Workspaces - move window
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Scratchpad
bind = $mainMod, T, togglespecialworkspace, magic
bind = $mainMod SHIFT, T, movetoworkspace, special:magic

bind = SUPER, F, fullscreen
