include ~/.cache/wal/colors-kitty.conf
#display server x11 for borderless and no title bar
sync_to_monitor no
hide_window_decorations yes
window_border_width 0
draw_minimal_borders yes

# Mac-like breathing room
window_padding_width 6

# Font: iTerm vibe (Medium weight looks more natural)
font_family JetBrainsMono NF Medium
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.93
confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1
enable_audio_bell no

# Animated + smooth cursor
cursor_trail 1
cursor_blink_interval 0.5

tab_bar_style separator
tab_separator " "
tab_title_template "{index}"
#tab_bar_style hidden 

#tab_bar_style separator
#tab_separator " | "
active_tab_background   #80d4dc
active_tab_foreground   #0e1415

inactive_tab_background #162326
inactive_tab_foreground #9aa5a6
tab_title_template "{index} {title}"
remember_window_size  yes
initial_window_width  1400
initial_window_height 800

#include colors.conf
